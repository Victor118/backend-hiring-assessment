openapi: "3.0.3"

info:
  title: Ads API
  description: Classified ads — list, read, create, import and delete ads.
  version: "1.0.0"

servers:
  - url: http://localhost:8080
    description: Local development server

paths:
  /health:
    get:
      summary: Health check
      operationId: healthCheck
      tags: [infra]
      responses:
        "200":
          description: Service is up

  /ads:
    get:
      summary: List ads
      operationId: listAds
      tags: [ads]
      parameters:
        - name: title
          in: query
          description: Case-insensitive substring match on the ad title.
          schema:
            type: string
          example: bike
        - name: user_id
          in: query
          description: Filter ads belonging to this owner.
          schema:
            type: string
            format: uuid
          example: "00000000-0000-0000-0000-000000000001"
        - name: min_price_cents
          in: query
          description: Inclusive lower bound on the price (in cents). 0 means no lower bound.
          schema:
            type: integer
            format: int64
            minimum: 0
          example: 5000
        - name: max_price_cents
          in: query
          description: Inclusive upper bound on the price (in cents). 0 means no upper bound.
          schema:
            type: integer
            format: int64
            minimum: 0
          example: 50000
      responses:
        "200":
          description: List of matching ads (may be empty).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListAdsResponse"
        "400":
          description: Invalid query parameter (e.g. non-numeric price).
        "500":
          description: Unexpected server error.

    post:
      summary: Create an ad
      operationId: createAd
      tags: [ads]
      security:
        - userID: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAdBody"
      responses:
        "201":
          description: Ad created. The body contains the generated identifier.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateAdResponse"
        "400":
          description: Malformed body, unknown field, or invalid ad (see CreateAdBody for the rules).
        "401":
          description: Missing Authorization header.
        "500":
          description: Unexpected server error.

  /ads/import:
    post:
      summary: Import ads in bulk
      description: |
        Creates every ad of the batch or none of them: the ads are inserted in a single transaction, and one invalid ad
        rejects the whole batch. An empty batch is rejected.

        The import is idempotent through the Idempotency-Key header. A retry with the same key and the same ads answers
        with the identifiers of the first import, without creating anything. The same key with other ads is rejected.
        Keys are scoped to their owner, and concurrent requests with the same key create the ads only once.
      operationId: importAds
      tags: [ads]
      security:
        - userID: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Generated by the client for each import, and sent again unchanged when retrying it. Case-insensitive.
          schema:
            type: string
            format: uuid
          example: "3f6c1a52-8e0b-4d6e-9a43-2b7f5c9d1e80"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportAdsBody"
      responses:
        "201":
          description: Ads created, or the import was already made under this key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportAdsResponse"
        "400":
          description: Missing or non-UUID Idempotency-Key, malformed body, unknown field, empty batch, or an invalid ad in the batch.
        "401":
          description: Missing Authorization header.
        "422":
          description: The Idempotency-Key was already used by this owner for another batch.
        "500":
          description: Unexpected server error.

  /ads/{adID}:
    get:
      summary: Get an ad by ID
      operationId: getAd
      tags: [ads]
      parameters:
        - $ref: "#/components/parameters/AdID"
      responses:
        "200":
          description: The requested ad, with the username of its owner.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdDetails"
        "400":
          description: adID is not a valid integer.
        "404":
          description: No ad exists with this ID.
        "500":
          description: Unexpected server error.

    delete:
      summary: Delete an ad
      operationId: deleteAd
      tags: [ads]
      security:
        - userID: []
      parameters:
        - $ref: "#/components/parameters/AdID"
      responses:
        "204":
          description: Ad deleted.
        "400":
          description: adID is not a valid integer.
        "401":
          description: Missing Authorization header.
        "403":
          description: The caller does not own the ad.
        "404":
          description: No ad exists with this ID.
        "500":
          description: Unexpected server error.

components:
  securitySchemes:
    userID:
      type: apiKey
      in: header
      name: Authorization
      description: The caller's user ID. No token validation is performed — the value is used as-is as the owner identifier.

  parameters:
    AdID:
      name: adID
      in: path
      required: true
      schema:
        type: integer
        format: int64
      example: 1

  schemas:
    Ad:
      type: object
      required: [id, title, price_cents, photo_url, user_id, created_at]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        title:
          type: string
          example: mountain bike
        price_cents:
          type: integer
          format: int64
          description: Price in euro cents.
          example: 15000
        photo_url:
          type: string
          example: https://example.com/bike.jpg
        user_id:
          type: string
          format: uuid
          example: "00000000-0000-0000-0000-000000000001"
        created_at:
          type: string
          format: date-time
          example: "2024-01-15T10:00:00Z"

    AdDetails:
      allOf:
        - $ref: "#/components/schemas/Ad"
        - type: object
          properties:
            username:
              type: string
              description: |
                Username of the owner, fetched from the users api. Omitted when it cannot be resolved (users api
                unavailable, or unknown owner): it never makes the request fail.
              example: bob

    ListAdsResponse:
      type: object
      required: [ads]
      properties:
        ads:
          type: array
          items:
            $ref: "#/components/schemas/Ad"

    CreateAdBody:
      type: object
      additionalProperties: false
      required: [title, price_cents, photo_url]
      properties:
        title:
          type: string
          minLength: 1
          description: Trimmed of surrounding spaces, and must not be empty once trimmed.
          example: mountain bike
        price_cents:
          type: integer
          format: int64
          minimum: 0
          description: Price in euro cents. 0 is a free ad.
          example: 15000
        photo_url:
          type: string
          example: https://example.com/bike.jpg

    CreateAdResponse:
      type: object
      required: [id]
      properties:
        id:
          type: integer
          format: int64
          description: Generated identifier of the new ad.
          example: 42

    ImportAdsBody:
      type: object
      additionalProperties: false
      required: [ads]
      properties:
        ads:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/CreateAdBody"

    ImportAdsResponse:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          description: Identifiers of the created ads, in the order of the batch.
          items:
            type: integer
            format: int64
          example: [107, 108]
